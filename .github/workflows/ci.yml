name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, test, build, smoke test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build
            - run: npm run test:smoke

    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
            - run: npm audit --audit-level=high
