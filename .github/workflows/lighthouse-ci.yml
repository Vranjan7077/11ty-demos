name: Lighthouse CI

on:
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    lighthouse:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20
                  cache: "npm"
            - run: npm ci
            - name: Run tests
              run: npm test
            - name: Build site
              run: npm run build
            - name: Run Lighthouse CI
              uses: treosh/lighthouse-ci-action@v12
              with:
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true
